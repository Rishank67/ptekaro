<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>PTEKaro</title>
    <link rel="stylesheet" crossorigin href="/ptekaro/assets/main-CECaCtfA.css">
  </head>
  <body
    class="font-[Poppins] bg-gradient-to-b from-blue-200 via-white to-blue-200 h-screen"
  >
    <section class="">
      <div class="bg-blue-500 shadow-md">
        <nav class="flex justify-between items-center w-[92%] mx-auto">
          <div>
            <img
              class="w-[25rem] h-[8rem]"
              src="/ptekaro/images/logo2.png"
              alt="PTEKaro-logo"
            />
          </div>
          <div class="">
            <ul
              class="flex items-center gap-[4rem] text-white font-bold text-xl"
            >
              <li>
                <a class="hover:text-amber-300" href="">ABOUT</a>
              </li>
              <li>
                <a class="hover:text-amber-300" href="">BOOK AN EXAM</a>
              </li>
              <li>
                <a class="hover:text-amber-300" href="">EXAMS</a>
              </li>
              <li>
                <a class="hover:text-amber-300" href="">FAQS</a>
              </li>
            </ul>
          </div>
          <div>
            <button
              class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-5 py-2 rounded-full hover:from-pink-300 hover:to-rose-300 shadow-2xl"
            >
              Sign In
            </button>
          </div>
        </nav>
      </div>

      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-4 w-[92%] mx-auto bg-white/10 p-5 rounded-xl mt-5 backdrop-blur-md border border-white/20 shadow-xl ring-1 ring-white/10 hover:ring-2 hover:ring-white/20 transition-all duration-300"
      >
        <div class="">
          <!-- <h1 class="font-bold text-white text-4xl">
            Book Your PTE Exam in Minutes – Fast, Easy & Reliable!
          </h1>
          <p>
            Instant confirmation. Trusted by 10,000+ test takers. No hidden
            fees.
          </p> -->
          <div class="">
            <img
              src="/ptekaro/images/hero-banner.jpg"
              alt="hero-banner"
              class="rounded-3xl shadow-2xl"
            />
          </div>
          <div class="text-center mt-5 text-white">
            <button
              class="bg-gradient-to-r from-pink-500 to-rose-500 w-[60%] font-semibold rounded-full py-2 hover:from-pink-300 hover:to-rose-300"
            >
              Explore Our Courses
            </button>
          </div>
        </div>

        <div class="grid gap-5">
          <h1
            class="text-5xl font-bold tracking-tight text-red-700 text-center"
          >
            Book Your Exam
          </h1>
          <form action="" class="space-y-6 text-[#FFFFFF40]md:shadow-2xl">
            <div class="relative text-center">
              <div
                class="absolute top-1 left-28 md:left-29 bg-[#FFFFFF40] rounded-full p-2 flex items-center justify-center text-red-800"
              >
                <i class="fa-solid fa-id-card"></i>
              </div>
              <input
                type="text"
                id="name"
                placeholder="Name"
                required
                autocomplete="off"
                class="w-[60%] px-12 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400 focus:drop-shadow-lg backdrop-blur-md border border-white/20 shadow-xl ring-1 ring-white/10 hover:ring-2 hover:ring-white/20 transition-all duration-300"
              />
            </div>

            <div class="relative text-center">
              <div
                class="absolute top-1 left-28 md:left-29 bg-[#FFFFFF40] rounded-full p-2 flex items-center justify-center text-red-800"
              >
                <i class="fa-solid fa-envelope-open"></i>
              </div>
              <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
                autocomplete="off"
                class="w-[60%] px-12 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400 focus:drop-shadow-lg backdrop-blur-md border border-white/20 shadow-xl ring-1 ring-white/10 hover:ring-2 hover:ring-white/20 transition-all duration-300"
              />
            </div>

            <div class="relative text-center">
              <div
                class="absolute top-1 left-28 md:left-29 bg-[#FFFFFF40] rounded-full p-2 flex items-center justify-center text-red-800"
              >
                <i class="fa-solid fa-phone"></i>
              </div>
              <input
                type="tel"
                id="mobile-number"
                placeholder="Mobile Number"
                required
                autocomplete="off"
                class="w-[60%] px-12 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400 focus:drop-shadow-lg backdrop-blur-md border border-white/20 shadow-xl ring-1 ring-white/10 hover:ring-2 hover:ring-white/20 transition-all duration-300"
              />
            </div>
            <div class="text-center">
              <button
                class="bg-gradient-to-r from-pink-500 to-rose-500 w-[60%] font-semibold rounded-full py-2 hover:from-pink-300 hover:to-rose-300 text-white"
              >
                Book Now
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
